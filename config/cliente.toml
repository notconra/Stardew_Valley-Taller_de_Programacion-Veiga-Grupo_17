# Configuración del cliente.
#
# Las rutas de los recursos son relativas al directorio desde el que se ejecuta el cliente
# así que al momento de ejecutar el cliente sería algo como:
#
#   ./build/client config/cliente.toml

mapa_inicial = "granja"

[servidor]
host = "127.0.0.1"
puerto = "8080"

[ventana]
titulo = "Stardew Valley"
ancho = 720
alto = 520

[sdl]
acelerado = true
vsync = true

[graficos]
tamano_de_tile = 16
escala_de_tiles = 2
color_de_fondo = [0, 0, 0, 255]

[[mapas]]
id = "granja"
ruta = "Assets/Maps/Farm.tmx"
capas_bajo_los_jugadores = ["Back", "Buildings"]
capas_sobre_los_jugadores = ["Front", "AlwaysFront", "AlwaysFront2"]

