[juego.transiciones]
# Destinos que se usan con clic derecho. Todo lo demás (salir de la casa, entrar a la mina,
# cambiar de mapa) se activa al pisarlo.
destinos_con_clic = ["FarmHouse2", "siguiente", "mercado"]

[juego.dia]
# Un día de juego va de las 6 am a las 2 am (20 horas de juego). velocidad elige cuánto dura en
# tiempo real: "lento" = 20 minutos, "medio" = 14 minutos (lo que pide el enunciado), "rapido" = 7.
velocidad = "medio"
# Si está, pisa a la velocidad (en minutos reales, acepta decimales). Útil para probar: con 1.0
# cada día dura un minuto.
# duracion_en_minutos = 1.0
# Días de cada estación. Hay 4 estaciones por año (primavera, verano, otoño, invierno): con 28,
# Para probar el cambio de estación se puede bajar a 1.
dias_por_estacion = 28

[juego.movimiento]
# velocidad = 200.0
# hitbox_x = 2
# hitbox_y = 24
# hitbox_ancho = 12
# hitbox_alto = 8

[juego.aparicion]
x = 432
y = 416
# paso_de_busqueda = 8

[juego.inventario]
# cantidad_ranuras_barra = 10

[juego.acciones]
# Las duraciones se miden en ticks (con ticks_por_segundo = 40, 8 ticks son 0,2 segundos).
# alcance_en_casillas = 1
duracion_picar_en_ticks = 16
duracion_tratar_tierra_en_ticks = 16
duracion_atacar_en_ticks = 18
danio_espada = 25
energia_por_golpe = 3
energia_por_picar = 3
energia_por_tratar_tierra = 3
energia_por_plantar = 1
energia_por_regar = 2
energia_por_cosechar = 1

[juego.cultivos]
# La calidad de lo cosechado arranca en perfecta y baja un nivel por cada falta (sin pasar de
# base). Un riego es tardío si se hace en la segunda mitad de su turno, y perdido si no se hace en
# todo el turno. Cada día que una planta madura espera sin cosechar también suma.
faltas_por_riego_tardio = 1
faltas_por_riego_perdido = 2
faltas_por_dia_sin_cosechar = 1
# Después la suerte puede subir o bajar la calidad un nivel.
probabilidad_de_subir_calidad = 0.2
probabilidad_de_bajar_calidad = 0.1

[juego.drops]
# radio_de_recogida_en_casillas = 1
# distancia_de_soltado_en_casillas = 2   # tiene que ser mayor que el radio

[mazmorra]
