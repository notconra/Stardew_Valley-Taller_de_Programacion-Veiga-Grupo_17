[juego.transiciones]
# Destinos que se usan con clic derecho. Todo lo demás (salir de la casa, entrar a la mina,
# cambiar de mapa) se activa al pisarlo.
destinos_con_clic = ["FarmHouse", "siguiente"]

[juego.movimiento]
# velocidad = 200.0
# hitbox_x = 2
# hitbox_y = 24
# hitbox_ancho = 12
# hitbox_alto = 8

[juego.aparicion]
# x = 200
# y = 150
# paso_de_busqueda = 8

[juego.inventario]
# cantidad_ranuras_barra = 10

[juego.acciones]
# Las duraciones se miden en ticks (con ticks_por_segundo = 40, 8 ticks son 0,2 segundos).
# alcance_en_casillas = 1
duracion_picar_en_ticks = 16
duracion_tratar_tierra_en_ticks = 16

[juego.drops]
# radio_de_recogida_en_casillas = 1
# distancia_de_soltado_en_casillas = 2   # tiene que ser mayor que el radio

# La mazmorra. Una transición con mapa_destino = destino (en Farm.tmx) entra al nivel 1.
[mazmorra]
destino = "mazmorra"
mapas = ["mina_1", "mina_2", "mina_3", "mina_4", "mina_5", "mina_6", "mina_7", "mina_8", "mina_9", "mina_11", "mina_12", "mina_13", "mina_14", "mina_15", "mina_16", "mina_17", "mina_18", "mina_19", "mina_21", "mina_24"]
enemigos_por_nivel = 4
minerales_por_nivel = 50
# Probabilidad de que cada nivel tenga un cofre abandonado (entre 0.0 y 1.0).
probabilidad_de_cofre = 0.90

# Minerales (opcional). Si hay al menos un [[mazmorra.minerales]], reemplazan a los por defecto:
# los que no listemos acá no aparecen en los niveles. "peso" es la frecuencia relativa y
# "desde_nivel" el primer nivel donde puede aparecer (el enunciado pide el oro desde el 5).
# "cantidad_minima" y "cantidad_maxima" son el rango de unidades que deja al picarse (inclusive).
# Claves válidas: PIEDRA, CARBON, LAPISLAZULI, PLATA, ORO.

[[mazmorra.minerales]]
clave = "PIEDRA"
golpes_para_picar = 1
peso = 100
cantidad_minima = 1
cantidad_maxima = 3

[[mazmorra.minerales]]
clave = "CARBON"
golpes_para_picar = 1
peso = 25
cantidad_minima = 1
cantidad_maxima = 2

[[mazmorra.minerales]]
clave = "PLATA"
golpes_para_picar = 3
peso = 6
cantidad_minima = 1
cantidad_maxima = 2

[[mazmorra.minerales]]
clave = "LAPISLAZULI"
golpes_para_picar = 2
peso = 10
probabilidad_de_no_dejar = 0.15
cantidad_minima = 1
cantidad_maxima = 2

[[mazmorra.minerales]]
clave = "ORO"
golpes_para_picar = 4
peso = 1
cantidad_minima = 1
cantidad_maxima = 2
desde_nivel = 5
