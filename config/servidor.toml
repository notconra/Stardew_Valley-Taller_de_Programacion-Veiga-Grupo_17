[juego.transiciones]
# Destinos que se usan con clic derecho. Todo lo demás (salir de la casa, entrar a la mina,
# cambiar de mapa) se activa al pisarlo.
destinos_con_clic = ["FarmHouse", "siguiente"]

[juego.dia]
# Un día de juego va de las 6 am a las 2 am (20 horas de juego). velocidad elige cuánto dura en
# tiempo real: "lento" = 20 minutos, "medio" = 14 minutos (lo que pide el enunciado), "rapido" = 7.
velocidad = "medio"
# Si está, pisa a la velocidad (en minutos reales, acepta decimales). Útil para probar: con 1.0
# cada día dura un minuto.
# duracion_en_minutos = 1.0
# Días de cada estación. Hay 4 estaciones por año (primavera, verano, otoño, invierno): con 28,
# Para probar el cambio de estación se puede bajar a 1.
dias_por_estacion = 28

