# Pinches en el suelo (enunciado: se activan por tiempo). Pasan ticks_inactiva guardados y
# ticks_activa afuera; a cada jugador parado encima le sacan "danio" una vez por activación.
[mazmorra.trampas]
por_nivel = 24
danio = 10
ticks_inactiva = 90
ticks_activa = 30

# Minerales (opcional). Si hay al menos un [[mazmorra.minerales]], reemplazan a los por defecto:
# los que no listemos acá no aparecen en los niveles. "peso" es la frecuencia relativa y
# "desde_nivel" el primer nivel donde puede aparecer (el enunciado pide el oro desde el 5).
# "cantidad_minima" y "cantidad_maxima" son el rango de unidades que deja al picarse (inclusive).
# Claves válidas: PIEDRA, CARBON, LAPISLAZULI, PLATA, ORO.

[[mazmorra.minerales]]
clave = "PIEDRA"
golpes_para_picar = 1
peso = 100
cantidad_minima = 1
cantidad_maxima = 3

